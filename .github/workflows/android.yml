name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub-hosted Ubuntu images already include the Android SDK.
      # The old setup-android action tries to install the removed "tools" package.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests and build debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Rename APK for installation
        run: cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/DailyOffice.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DailyOffice-APK
          path: app/build/outputs/apk/debug/DailyOffice.apk
