name: Android Play Release Validation

on:
  push:
    branches:
      - release/**
  pull_request:
    branches:
      - feature/mei-office-foundation
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle --no-daemon lintDebug --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Build release bundle (unsigned validation only)
        run: gradle --no-daemon bundleRelease --stacktrace

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyOffice-debug-validation
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: DailyOffice-release-UNSIGNED-not-for-Play
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
